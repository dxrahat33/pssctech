<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PCB Solution BD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Background matching the landing page theme */
        .login-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-slate-50 p-6 border-b border-slate-100 text-center">
            <div class="text-blue-600 text-5xl mb-3">
                <i class="fas fa-microchip"></i>
            </div>
            <h1 class="font-bold text-2xl text-slate-800 leading-tight">PCB Solution BD</h1>
            <p class="text-sm text-slate-500 mt-1">Parvez Sewing & Servicing Center</p>
        </div>

        <!-- Form Section -->
        <div class="p-8">
            <h2 class="text-xl font-semibold text-slate-700 mb-6 text-center">Welcome Back!</h2>
            
            <!-- Error Message Container (Hidden by default) -->
            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm font-medium p-3 rounded-lg mb-4 border border-red-100 text-center">
                <i class="fas fa-exclamation-circle mr-1"></i> Incorrect username or password!
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-user"></i>
                        </div>
                        <input type="text" id="username" class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="Enter username (admin)" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-lock"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="Enter password (12345)" required>
                    </div>
                    <div class="flex justify-end mt-1">
                        <a href="#" class="text-xs text-blue-600 hover:underline">Forgot Password?</a>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <!-- Back to Home Link -->
            <div class="mt-6 text-center text-sm text-slate-500">
                <a href="index.html" class="hover:text-blue-600 transition-colors"><i class="fas fa-arrow-left mr-1"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Login Logic -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Page reload theke atkanor jonno
            
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            // Username ebong password check kora hocche (eikhane 'admin' o '12345' deya hoyeche)
            if (user === 'admin' && pass === '12345') {
                errorMsg.classList.add('hidden'); // Error msg lukiye felbe
                
                // Dashboard e redirect korbe
                window.location.href = 'dashboard.html'; 
            } else {
                // Vul hole error message show korbe
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
